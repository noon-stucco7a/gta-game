<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marina Heat — an original open-world crime game in Port Solano</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #160d24; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, 177.78vh);
    aspect-ratio: 8 / 5;
    display: block;
    touch-action: none;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Marina Heat: explore Port Solano on foot and by car, run Rosa's jobs, and dodge the police. WASD to move and drive, E to enter cars and talk, mouse to aim, click to shoot."></canvas>
<p id="status" role="status" aria-live="polite">Marina Heat is loading.</p>
<script type="module" src="./src/game.js"></script>
</body>
</html>
